<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑거런 - 로그인</title>
    
    <!-- 폰트 및 스타일 라이브러리 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f9fafb; }
    </style>

    <!-- [1] 파이어베이스 SDK (구글 로그인용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKOS6QVMn6fhsIu1Sj2JSrEfOpq1lR1vU",
            authDomain: "fingerrun-fe27d.firebaseapp.com",
            projectId: "fingerrun-fe27d",
            storageBucket: "fingerrun-fe27d.firebasestorage.app",
            messagingSenderId: "431093218250",
            appId: "1:431093218250:web:6c1d4c07202bd661412d33"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 구글 로그인 실행 함수
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    alert(user.displayName + "님, 핑거런에 오신 것을 환영합니다!");
                    window.location.href = "index.html"; // 로그인 성공 시 메인으로 이동
                })
                .catch((error) => {
                    console.error("구글 로그인 에러:", error);
                    alert("구글 로그인에 실패했습니다.");
                });
        };
    </script>

<!-- [2] 카카오 SDK (카카오 로그인용) -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" integrity="sha384-TiCmbV0X04/KpzjtO41jsq+s1E8Oofv7aB41A5R0jZk2A9X7n8v15R41bX/0kY2P" crossorigin="anonymous"></script>
    <script>
        // 주석을 해제하고 서준님의 실제 카카오 키를 활성화했습니다.
        Kakao.init('2cb9737bee37e4400e3e72503b3db932');
        
        window.loginWithKakao = function() {
            Kakao.Auth.login({
                success: function(authObj) {
                    Kakao.API.request({
                        url: '/v2/user/me',
                        success: function(res) {
                            alert(res.kakao_account.profile.nickname + "님, 핑거런에 오신 것을 환영합니다!");
                            window.location.href = "index.html"; // 로그인 성공 시 메인으로 이동
                        },
                        fail: function(error) {
                            console.error('사용자 정보 요청 에러', error);
                        }
                    });
                },
                fail: function(err) {
                    console.error('카카오 로그인 에러', err);
                }
            });
        }
    </script>
</head>

<body class="h-screen flex items-center justify-center">
    <!-- 로그인 박스 -->
    <div class="w-full max-w-sm p-8 bg-white rounded-2xl shadow-sm border border-gray-100 text-center">
        
        <!-- 로고 및 타이틀 영역 -->
        <div class="flex items-center justify-center gap-2 mb-10">
            <img src="images/finger-run-logo.svg" alt="FingerRun Logo" class="h-8 w-auto">
            <span class="text-3xl font-bold text-gray-900 tracking-tight">FingerRun</span>
        </div>

        <!-- 구글 로그인 버튼 -->
        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center bg-white border border-gray-300 rounded p-3.5 mb-3 text-gray-700 font-medium hover:bg-gray-50 transition shadow-sm relative">
            <!-- 구글 컬러 아이콘 -->
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5 absolute left-4">
            구글 아이디로 로그인
        </button>

        <!-- 카카오 로그인 버튼 -->
        <button onclick="loginWithKakao()" class="w-full flex items-center justify-center bg-[#FEE500] rounded p-3.5 mb-10 text-[#191919] font-medium hover:bg-[#edd500] transition shadow-sm relative">
            <i class="fas fa-comment text-xl absolute left-4"></i>
            카카오 아이디로 로그인
        </button>

        <!-- 하단 돌아가기 링크 -->
        <a href="index.html" class="text-gray-400 text-sm hover:text-gray-600 transition">
            메인 페이지로 돌아가기
        </a>

    </div>
</body>
</html>
