    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDK•••••••••••••••••••••••••••••••",
            authDomain: "fingerrun-fe27d.firebaseapp.com",
            projectId: "fingerrun-fe27d",
            storageBucket: "fingerrun-fe27d.firebasestorage.app",
            messagingSenderId: "431093218250",
            appId: "1:431093218250:web:6c1d4c07202bd661412d33"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.handleUserLogin = async function(user, providerName) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            let userData;
            if (!userSnap.exists()) {
                userData = {
                    uid: user.uid,
                    email: user.email || "",
                    nickname: user.displayName || "익명",
                    joinDate: new Date().toLocaleDateString(),
                    provider: providerName,
                    avgSpeed: 0,
                    maxSpeed: 0,
                    totalSessions: 0,
                    cumulativeSpeed: 0
                };
                await setDoc(userRef, userData);
            } else {
                userData = userSnap.data();
            }

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('fingerRunUser', JSON.stringify(userData));
            
            alert(userData.nickname + "님, 핑거런에 오신 것을 환영합니다!");
            
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('invite') && urlParams.get('invite') === 'true') {
                window.location.href = "mypage.html" + window.location.search;
            } else {
                window.location.href = "index.html";
            }
        };

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider)
                .then((result) => window.handleUserLogin(result.user, 'google'))
                .catch((error) => {
                    console.error("구글 로그인 에러:", error);
                    alert("구글 로그인에 실패했습니다.");
                });
        };
    </script>

    <script src="https://t1.kakaocdn.net/kakao_js_sdk/1.43.1/kakao.min.js"></script>
    <script>
        Kakao.init('7b63627546de886d4d770279e23ed775');
        
        window.loginWithKakao = function() {
            Kakao.Auth.login({
                success: function(authObj) {
                    Kakao.API.request({
                        url: '/v2/user/me',
                        success: function(res) {
                            const kakaoUser = {
                                uid: "kakao_" + res.id,
                                email: res.kakao_account.email || "",
                                displayName: res.kakao_account.profile.nickname
                            };
                            window.handleUserLogin(kakaoUser, 'kakao');
                        },
                        fail: function(error) { console.error('정보 요청 에러', error); }
                    });
                },
                fail: function(err) { console.error('로그인 에러', err); }
            });
        }
