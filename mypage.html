<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑거런 - 마이페이지</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 그래프를 그리기 위한 Chart.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f9fafb; color: #191f28; }
    </style>
</head>
<body class="pb-20">

    <!-- 상단 네비게이션 바 -->
    <nav class="bg-white border-b border-gray-200 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fas fa-keyboard"></i> FingerRun
            </a>
            <a href="index.html" class="text-gray-500 hover:text-gray-900 font-medium text-sm transition">
                메인으로 돌아가기 <i class="fas fa-arrow-right ml-1"></i>
            </a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-12 px-6">
        <div class="flex items-end gap-3 mb-8">
            <h1 class="text-3xl font-bold">마이페이지</h1>
            <span id="welcome-message" class="text-gray-500 mb-1">사용자 정보를 불러오는 중...</span>
        </div>

        <!-- [1] 타자 통계 대시보드 (문장 연습 기록 기반) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- 평균 타수 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                <span class="text-gray-500 text-sm font-medium mb-2">문장연습 평균 타수</span>
                <div class="text-3xl font-bold text-gray-900"><span id="avg-speed">-</span> <span class="text-base font-normal text-gray-500">타/분</span></div>
            </div>
            
            <!-- 최고 타수 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                <span class="text-gray-500 text-sm font-medium mb-2">문장연습 최고 타수</span>
                <div class="text-3xl font-bold text-blue-600"><span id="max-speed">-</span> <span class="text-base font-normal text-gray-500">타/분</span></div>
            </div>

            <!-- 전체 문장 연습 횟수 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center relative">
                <i class="fas fa-history text-blue-100 absolute top-4 right-4 text-2xl"></i>
                <span class="text-gray-500 text-sm font-medium mb-2">전체 문장 연습 횟수</span>
                <div class="text-3xl font-bold text-gray-900"><span id="total-sessions">-</span> <span class="text-base font-normal text-gray-500">회</span></div>
            </div>
        </div>

        <!-- [NEW] 성장 그래프 섹션 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mb-12">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-lg font-bold text-gray-900">나의 타자 성장 기록</h2>
                
                <!-- 기간 필터링 버튼 (data-days 값을 일수로 설정) -->
                <div class="flex gap-1 bg-gray-100 p-1 rounded-lg">
                    <button class="filter-btn px-4 py-1.5 text-sm rounded-md text-gray-500 hover:text-gray-700 font-medium transition" data-days="1">1일</button>
                    <button class="filter-btn px-4 py-1.5 text-sm rounded-md bg-white shadow-sm text-blue-600 font-bold transition active" data-days="10">10일</button>
                    <button class="filter-btn px-4 py-1.5 text-sm rounded-md text-gray-500 hover:text-gray-700 font-medium transition" data-days="30">1달</button>
                    <button class="filter-btn px-4 py-1.5 text-sm rounded-md text-gray-500 hover:text-gray-700 font-medium transition" data-days="365">1년</button>
                </div>
            </div>

            <!-- 타수 그래프 -->
            <div class="mb-10 relative h-64">
                <h3 class="text-sm font-medium text-gray-500 mb-2">일별 평균 타수 변화 (타/분)</h3>
                <canvas id="speedChart"></canvas>
            </div>

            <!-- 정확도 그래프 -->
            <div class="relative h-64">
                <h3 class="text-sm font-medium text-gray-500 mb-2">일별 정확도 변화 (%)</h3>
                <canvas id="accuracyChart"></canvas>
            </div>
        </div>

        <!-- [2] 개인정보 리스트 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
            <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-900">회원 정보</h2>
                <span id="login-provider" class="text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded">연동 정보</span>
            </div>
            
            <div class="px-8">
                <!-- 이메일 -->
                <div class="flex items-center py-6 border-b border-gray-100">
                    <div class="w-32 text-gray-500 font-medium text-sm">이메일</div>
                    <div id="user-email" class="flex-1 text-gray-700 font-mono text-sm">정보 없음</div>
                </div>

                <!-- 닉네임 -->
                <div class="flex items-center py-6 border-b border-gray-100">
                    <div class="w-32 text-gray-500 font-medium text-sm">닉네임</div>
                    <div class="flex-1 text-gray-900 font-medium flex items-center gap-2">
                        <span id="user-nickname">정보 없음</span>
                        <button onclick="editProfile('nickname')" class="text-gray-400 hover:text-blue-600 transition">
                            <i class="fas fa-pencil-alt text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- 생년월일 -->
                <div class="flex items-center py-6 border-b border-gray-100">
                    <div class="w-32 text-gray-500 font-medium text-sm">생년월일</div>
                    <div class="flex-1 text-gray-900 font-medium flex items-center gap-2">
                        <span id="user-birthdate">미등록</span>
                        <button onclick="editProfile('birthdate')" class="text-gray-400 hover:text-blue-600 transition">
                            <i class="fas fa-pencil-alt text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- 가입일 -->
                <div class="flex items-center py-6">
                    <div class="w-32 text-gray-500 font-medium text-sm">가입일</div>
                    <div id="user-joindate" class="flex-1 text-gray-700">정보 없음</div>
                </div>
            </div>
        </div>

        <!-- [3] 로그아웃 버튼 -->
        <div class="flex justify-end">
            <button onclick="handleLogout()" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition text-sm">
                로그아웃
            </button>
        </div>
    </div>

    <script>
        // 차트 인스턴스를 저장할 전역 변수
        let speedChartInstance = null;
        let accuracyChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('fingerRunUser');

            if (savedUser) {
                const userData = JSON.parse(savedUser);

                // 1. 연습 기록 및 횟수 표시
                document.getElementById('avg-speed').innerText = userData.avgSpeed || 0;
                document.getElementById('max-speed').innerText = userData.maxSpeed || 0;
                document.getElementById('total-sessions').innerText = userData.totalSessions || 0;

                // 개인정보 표시
                document.getElementById('welcome-message').innerText = userData.nickname + "님, 환영합니다!";
                document.getElementById('user-email').innerText = userData.email || "이메일 정보 제공 미동의";
                document.getElementById('user-nickname').innerText = userData.nickname;
                document.getElementById('user-joindate').innerText = userData.joinDate || "정보 없음";
                
                document.getElementById('login-provider').innerText = userData.provider === 'google' ? 'Google 연동' : 'Kakao 연동';
                document.getElementById('login-provider').className = userData.provider === 'google' 
                    ? 'text-xs px-2 py-1 bg-white border border-gray-300 text-gray-600 rounded font-medium'
                    : 'text-xs px-2 py-1 bg-[#FEE500] text-[#191919] rounded font-medium';

                // ==========================================
                // 📊 [그래프 데이터 생성] 
                // userData.dailyRecords가 없으면 가상의 1년치 기록을 만듭니다.
                // ==========================================
                if (!userData.dailyRecords) {
                    const today = new Date();
                    const mockRecords = [];
                    let baseSpd = userData.avgSpeed > 50 ? userData.avgSpeed - 50 : 200;
                    let baseAcc = 85;
                    
                    // 과거 365일부터 오늘까지 띄엄띄엄(연습 안 한 날 제외) 데이터 생성
                    for(let i = 365; i >= 1; i -= Math.floor(Math.random() * 5 + 1)) {
                        const d = new Date(today);
                        d.setDate(d.getDate() - i);
                        
                        // 날짜 텍스트 안전하게 변환 (YYYY-MM-DD 형식)
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        const dateStr = `${d.getFullYear()}-${month}-${day}`;

                        mockRecords.push({
                            date: dateStr,
                            speed: Math.floor(baseSpd + Math.random() * 40),
                            accuracy: Math.floor(Math.min(100, baseAcc + Math.random() * 10))
                        });
                        baseSpd += 0.5; 
                        baseAcc += 0.05;
                    }
                    
                    // 오늘 날짜 무조건 추가
                    const tMonth = String(today.getMonth() + 1).padStart(2, '0');
                    const tDay = String(today.getDate()).padStart(2, '0');
                    mockRecords.push({
                        date: `${today.getFullYear()}-${tMonth}-${tDay}`,
                        speed: userData.avgSpeed || 300,
                        accuracy: 98
                    });

                    userData.dailyRecords = mockRecords;
                    localStorage.setItem('fingerRunUser', JSON.stringify(userData));
                }

                // 2. 차트 초기 렌더링 (기본 10일 설정)
                renderCharts(userData.dailyRecords, 10);

            } else {
                alert("로그인이 필요한 페이지입니다.");
                window.location.href = "login.html";
            }

            // 필터 버튼(1일, 10일, 1달, 1년) 이벤트 연결
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // 이벤트 발생 대상을 현재 클릭된 버튼으로 정확히 한정 (안전성)
                    const targetBtn = e.currentTarget;

                    // 전체 버튼 스타일 초기화
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-white', 'shadow-sm', 'text-blue-600', 'font-bold', 'active');
                        b.classList.add('text-gray-500', 'font-medium');
                    });

                    // 클릭된 버튼만 스타일 활성화
                    targetBtn.classList.remove('text-gray-500', 'font-medium');
                    targetBtn.classList.add('bg-white', 'shadow-sm', 'text-blue-600', 'font-bold', 'active');
                    
                    // 필터링 적용 후 다시 그리기
                    const days = parseInt(targetBtn.dataset.days);
                    const userData = JSON.parse(localStorage.getItem('fingerRunUser'));
                    renderCharts(userData.dailyRecords, days);
                });
            });
        });

        // 차트를 그려주는 핵심 함수
        function renderCharts(records, daysFilter) {
            if (!records || records.length === 0) return;

            // 1. 기간에 맞춰 데이터 필터링 (가장 안전한 날짜 텍스트 비교)
            const today = new Date();
            const cutoffDate = new Date(today);
            cutoffDate.setDate(today.getDate() - daysFilter + 1); // 지정한 날짜만큼 뒤로 (오늘 포함)
            
            const month = String(cutoffDate.getMonth() + 1).padStart(2, '0');
            const day = String(cutoffDate.getDate()).padStart(2, '0');
            const cutoffStr = `${cutoffDate.getFullYear()}-${month}-${day}`;

            // 기준 날짜 이후(최근)의 데이터만 남김
            const filtered = records.filter(r => r.date >= cutoffStr);

            // 데이터가 아예 없을 경우를 대비한 안전 장치
            const finalData = filtered.length > 0 ? filtered : records.slice(-1);

            // 2. X, Y축 데이터 매핑 (연습을 안 한 날짜는 배열에 없으므로 자동 생략됨)
            // 'YYYY-MM-DD' 에서 'MM-DD'로 잘라서 표시
            const labels = finalData.map(r => r.date.substring(5)); 
            const speedData = finalData.map(r => r.speed);
            const accuracyData = finalData.map(r => r.accuracy);

            // 3. 기존 차트 파괴 (메모리 누수 방지 및 그래프 겹침 방지)
            if (speedChartInstance) speedChartInstance.destroy();
            if (accuracyChartInstance) accuracyChartInstance.destroy();

            // 공통 차트 옵션 설정
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                elements: {
                    line: { tension: 0.4 }, // 부드러운 곡선
                    point: { radius: labels.length > 30 ? 1 : 4, hoverRadius: 6 } // 데이터 많으면 점 작게
                }
            };

            // 4. 평균 타수(속도) 그래프 그리기
            const ctxSpeed = document.getElementById('speedChart').getContext('2d');
            speedChartInstance = new Chart(ctxSpeed, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '평균 타수',
                        data: speedData,
                        borderColor: '#3b82f6', // 파란색 선
                        backgroundColor: 'rgba(59, 130, 246, 0.1)', // 파란색 그림자
                        borderWidth: 3,
                        fill: true
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: { y: { suggestedMin: 0 } }
                }
            });

            // 5. 정확도 그래프 그리기
            const ctxAccuracy = document.getElementById('accuracyChart').getContext('2d');
            accuracyChartInstance = new Chart(ctxAccuracy, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '정확도 (%)',
                        data: accuracyData,
                        borderColor: '#10b981', // 초록색 선
                        backgroundColor: 'rgba(16, 185, 129, 0.1)', // 초록색 그림자
                        borderWidth: 3,
                        fill: true
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: { y: { min: 40, max: 100 } } // 정확도는 보통 40% 밑으로 잘 안 떨어지므로 범위 고정
                }
            });
        }

        // 닉네임/생일 수정 및 파이어베이스 저장 기능
        async function editProfile(type) {
            const savedUser = localStorage.getItem('fingerRunUser');
            if (!savedUser) return;
            const userData = JSON.parse(savedUser);
            let isChanged = false;

            if (type === 'nickname') {
                const newName = prompt("새로운 닉네임을 입력하세요:", userData.nickname);
                if (newName && newName.trim() !== "" && newName !== userData.nickname) {
                    userData.nickname = newName;
                    document.getElementById('user-nickname').innerText = newName;
                    isChanged = true;
                }
            } else if (type === 'birthdate') {
                const newDate = prompt("생년월일을 입력하세요 (YYYY/MM/DD):", userData.birthdate || "2000/01/01");
                if (newDate && newDate !== userData.birthdate) {
                    userData.birthdate = newDate;
                    document.getElementById('user-birthdate').innerText = newDate;
                    isChanged = true;
                }
            }

            if (isChanged) {
                // 1. 로컬 저장
                localStorage.setItem('fingerRunUser', JSON.stringify(userData));
                
                // 2. 파이어베이스 DB 전송
                try {
                    const { initializeApp, getApps, getApp } = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js");
                    const { getFirestore, doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");
                    
                    // 서준님의 전체 Firebase 접속 정보 원복 완료
                    const firebaseConfig = {
                        apiKey: "AIzaSyDKOS6QVMn6fhsIu1Sj2JSrEfOpq1lR1vU",
                        authDomain: "fingerrun-fe27d.firebaseapp.com",
                        projectId: "fingerrun-fe27d",
                        storageBucket: "fingerrun-fe27d.firebasestorage.app",
                        messagingSenderId: "431093218250",
                        appId: "1:431093218250:web:6c1d4c07202bd661412d33",
                        measurementId: "G-EQSEGCJTEX"
                    };
                    
                    // 앱 중복 초기화 에러 방지
                    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
                    const db = getFirestore(app);
                    const userRef = doc(db, "users", userData.uid);
                    
                    await updateDoc(userRef, {
                        nickname: userData.nickname,
                        birthdate: userData.birthdate || ""
                    });
                    
                    alert("정보가 성공적으로 변경되었습니다.");
                } catch (error) {
                    console.error("DB 업데이트 실패:", error);
                    alert("화면에는 반영되었으나, 서버 저장에 실패했습니다.");
                }
            }
        }

        // 로그아웃 기능
        function handleLogout() {
            if (confirm("정말 로그아웃 하시겠습니까?")) {
                localStorage.removeItem('fingerRunUser');
                localStorage.removeItem('isLoggedIn');
                alert("로그아웃 되었습니다.");
                window.location.href = "index.html"; 
            }
        }
    </script>
</body>
</html>
